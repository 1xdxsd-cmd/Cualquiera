name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    # pinned: ubuntu-latest started moving to Ubuntu 26 (Oct 2026) and the Android SDK setup broke there
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    # No separate SDK setup: the ubuntu-24.04 runner image ships the Android SDK with
    # licenses accepted (ANDROID_HOME). android-actions/setup-android@v3 began failing in Oct 2026.
    - name: Show Android SDK
      run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

    - name: Create Gradle Wrapper
      run: gradle wrapper --gradle-version 8.2

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: StreamingThalia
        path: app/build/outputs/apk/debug/app-debug.apk
